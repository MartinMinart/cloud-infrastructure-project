services:
  postgres:
    image: postgres:15-alpine
    container_name: analytics-postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - analytics-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: analytics-metabase
    restart: always
    env_file: .env
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_DB_NAME}
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./metabase/data:/metabase.db
      - ./metabase/logs:/logs
      - ./metabase/plugins:/plugins
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - analytics-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: analytics-clickhouse
    restart: always
    env_file: .env
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "8123:8123"
      - "9005:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - analytics-net

  superset:
    image: apache/superset:latest
    container_name: analytics-superset
    restart: always
    env_file: .env
    environment:
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
      SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME}
      SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_DB: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - superset_home:/app/superset_home
    networks:
      - analytics-net

  redis:
    image: redis:7-alpine
    container_name: analytics-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - analytics-net

  kafka:
    image: apache/kafka:latest
    container_name: analytics-kafka
    restart: always
    env_file: .env
    environment:
      KAFKA_KRAFT_CLUSTER_ID: analytics-cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - analytics-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: analytics-qdrant
    restart: always
    env_file: .env
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - analytics-net

  minio:
    image: minio/minio:latest
    container_name: analytics-minio
    restart: always
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9105:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - analytics-net

  airflow:
    image: apache/airflow:2.10.0
    container_name: airflow
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://analytics:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=UTC
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      - postgres
    networks:
      - analytics-net
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.0
    container_name: airflow-scheduler
    restart: always
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://analytics:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=UTC
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    depends_on:
      - postgres
    networks:
      - analytics-net

  nifi:
    image: apache/nifi:latest
    container_name: nifi
    restart: always
    ports:
      - "8443:8443"
    environment:
      - NIFI_WEB_HTTP_PORT=8443
      - NIFI_CLUSTER_IS_NODE=false
    volumes:
      - nifi_data:/opt/nifi/nifi-current/flowfile_repository
      - nifi_database:/opt/nifi/nifi-current/database_repository
    networks:
      - analytics-net

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - analytics-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - analytics-net

  redash:
    image: redash/redash:latest
    container_name: redash
    restart: always
    ports:
      - "5000:5000"
    environment:
      - REDASH_DATABASE_URL=postgresql://analytics:${POSTGRES_PASSWORD}@postgres:5432/redash_db
      - REDASH_REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - analytics-net

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: always
    ports:
      - "1880:1880"
    volumes:
      - node_red_data:/data
    networks:
      - analytics-net

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:latest
    container_name: analytics-dbt
    restart: always
    working_dir: /usr/app
    volumes:
      - ./dbt:/usr/app
      - ./dbt/profiles:/root/.dbt
    environment:
      DBT_PROFILES_DIR: /root/.dbt
    depends_on:
      - postgres
    networks:
      - analytics-net

volumes:
  postgres_data:
  clickhouse_data:
  superset_home:
  kafka_data:
  qdrant_data:
  minio_data:
  nifi_data:
  nifi_database:
  mongo_data:
  grafana_data:
  node_red_data:

networks:
  analytics-net:
    driver: bridge
